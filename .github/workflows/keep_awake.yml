\f0\fs24 \cf0 name: Keep Streamlit App Awake\
\
on:\
  schedule:\
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)\
    - cron: '0 */6 * * *'\
  workflow_dispatch: # Allows you to manually trigger the ping from GitHub UI\
\
jobs:\
  ping:\
    runs-on: ubuntu-latest\
\
    steps:\
    - name: Checkout repository code\
      uses: actions/checkout@v4\
\
    - name: Set up Python\
      uses: actions/tools-python@v5\
      with:\
        python-version: '3.11'\
\
    - name: Install dependencies\
      run: |\
        python -m pip install --upgrade pip\
        pip install playwright\
        playwright install chromium\
\
    - name: Run the ping script\
      run: python keep_awake.py\
}